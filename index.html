<html>
<head>
  <title>Breakitt</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      height: 100vh;
      background: #141014 url('bg.jpg') 50% 50% / contain no-repeat;
      overflow: hidden;
      font-family: Calibri, 'Trebuchet MS', sans-serif;
      user-select: none;
      touch-action: none;
    }
    canvas { display: block; }
    #hud {
      position: fixed;
      left: 0; right: 0; top: 0;
      padding: 18px 22px;
      pointer-events: none;
      z-index: 10;
    }
    .hud-left { float: left; }
    .hud-right { float: right; }
    .hud-panel {
      background: rgba(20, 16, 20, 0.45);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 10px 18px;
      color: #f4ede3;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
    }
    .panel-lbl {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.6;
      padding-bottom: 2px;
    }
    #score-val {
      font-size: 28px;
      font-weight: 600;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    #combo-panel {
      text-align: right;
      opacity: 0;
      transform: scale(0.85);
      transition: transform 150ms ease, opacity 200ms ease;
    }
    #combo-panel.active { opacity: 1; transform: scale(1); }
    #combo-panel.bump { animation: pulse 280ms ease; }
    @keyframes pulse {
      0% { transform: scale(1.28); }
      100% { transform: scale(1); }
    }
    #combo-val {
      font-size: 24px;
      font-weight: 600;
      color: #ffb37a;
      line-height: 1;
    }
    #hint {
      position: fixed;
      bottom: 22px;
      left: 0;
      width: 100%;
      text-align: center;
      color: #f4ede3;
      opacity: 0.55;
      font-size: 13px;
      letter-spacing: 1px;
      pointer-events: none;
      z-index: 10;
      transition: opacity 600ms ease;
    }
    .score-popup {
      position: fixed;
      z-index: 20;
      pointer-events: none;
      font-weight: 700;
      color: #fff3e0;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      transform: translate(-50%, -50%);
      animation: pop 900ms ease-out forwards;
      white-space: nowrap;
    }
    @keyframes pop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
      15% { opacity: 1; transform: translate(-50%, -60%) scale(1.15); }
      100% { opacity: 0; transform: translate(-50%, -140%) scale(1); }
    }
    .dust-fx {
      position: fixed;
      z-index: 5;
      pointer-events: none;
      border-radius: 50%;
      animation: expandPuff 650ms ease-out forwards;
    }
    @keyframes expandPuff {
      0% { opacity: 0.55; transform: translate(-50%, -50%) scale(0.2); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(2.6); }
    }
    #banner {
      position: fixed;
      top: 90px;
      left: 0;
      width: 100%;
      text-align: center;
      z-index: 9;
      pointer-events: none;
    }
    #banner span {
      display: inline-block;
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #f4ede3;
      background: rgba(20, 16, 20, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 6px 16px;
      opacity: 0;
      transition: opacity 400ms ease;
    }
    #banner span.active { opacity: 0.85; }
  </style>
</head>
<body>
  <div id="hud">
    <div class="hud-panel hud-left">
      <p class="panel-lbl">Score</p>
      <p id="score-val">0</p>
    </div>
    <div class="hud-panel hud-right" id="combo-panel">
      <p class="panel-lbl">Combo</p>
      <p id="combo-val">x1</p>
    </div>
  </div>
  <div id="banner"><span id="banner-txt"></span></div>
  <div id="hint">swipe through an item on the shelf to smash it</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/poly-decomp@0.3.0/build/decomp.min.js"></script>
  <script>
    const M = Matter;
    if (window.decomp) M.Common.setDecomp(window.decomp);

    const eng = M.Engine.create();
    eng.gravity.y = 1;
    let vw = window.innerWidth, vh = window.innerHeight;

    const rdr = M.Render.create({
      element: document.body,
      engine: eng,
      options: { width: vw, height: vh, wireframes: false, background: 'transparent' }
    });
    M.Render.run(rdr);
    const loopRunner = M.Runner.create();
    M.Runner.run(loopRunner, eng);

    const ground = M.Bodies.rectangle(vw * 0.5, vh + 30, vw * 2, 60, { isStatic: true, render: { visible: false } });
    M.World.add(eng.world, ground);

    window.onresize = function() {
      vw = window.innerWidth;
      vh = window.innerHeight;
      rdr.bounds.max.x = vw;
      rdr.bounds.max.y = vh;
      rdr.options.width = vw;
      rdr.options.height = vh;
      rdr.canvas.width = vw * (rdr.options.pixelRatio || 1);
      rdr.canvas.height = vh * (rdr.options.pixelRatio || 1);
      rdr.canvas.style.width = vw + 'px';
      rdr.canvas.style.height = vh + 'px';
      M.Body.setPosition(ground, { x: vw * 0.5, y: vh + 30 });
      resetShelves();
    };

    const actx = new (window.AudioContext || window.webkitAudioContext)();

    function triggerAudio(mat, amp) {
      const len = mat.duration;
      const totalFrames = actx.sampleRate * len;
      const buf = actx.createBuffer(1, totalFrames, actx.sampleRate);
      const ch = buf.getChannelData(0);
      let idx = 0;
      while (idx < totalFrames) {
        ch[idx] = (Math.random() * 2 - 1) * Math.pow(1 - idx / totalFrames, mat.decayPow);
        idx++;
      }
      const src = actx.createBufferSource();
      src.buffer = buf;
      const f = actx.createBiquadFilter();
      f.type = 'bandpass';
      f.frequency.value = mat.freqMin + Math.random() * (mat.freqMax - mat.freqMin);
      f.Q.value = mat.q;
      const g = actx.createGain();
      g.gain.value = Math.min(1, 0.4 + amp * 0.6);
      src.connect(f);
      f.connect(g);
      g.connect(actx.destination);
      src.start();
      src.stop(actx.currentTime + len);

      if (mat.glassTing) {
        const osc = actx.createOscillator();
        const og = actx.createGain();
        const t0 = actx.currentTime;
        osc.type = 'sine';
        osc.frequency.value = mat.freqMax + Math.random() * 800;
        og.gain.setValueAtTime(0.001, t0);
        og.gain.linearRampToValueAtTime(0.25 * Math.min(1, 0.5 + amp * 0.5), t0 + 0.01);
        og.gain.exponentialRampToValueAtTime(0.001, t0 + 0.35);
        osc.connect(og);
        og.connect(actx.destination);
        osc.start(t0);
        osc.stop(t0 + 0.4);
      }
    }

        const CATALOG = [
      { key: 'plate', name: 'Plate', img: 'plate.png', radius: 92, weight: 28, shardsMin: 10, shardsMax: 14, density: 0.02, restitution: 0.15, friction: 0.3, shardColor: '#dfe0de', strokeColor: '#c7c7c4', points: 75, sound: { freqMin: 1300, freqMax: 2100, q: 0.7, duration: 0.25, decayPow: 2, glassTing: false } },
      { key: 'bowl', name: 'Bowl', img: 'bowl.png', radius: 70, weight: 22, shardsMin: 9, shardsMax: 12, density: 0.02, restitution: 0.15, friction: 0.3, shardColor: '#e8e8e8', strokeColor: '#cfcfcf', points: 65, sound: { freqMin: 1200, freqMax: 1900, q: 0.7, duration: 0.25, decayPow: 2, glassTing: false } },
      { key: 'cup', name: 'Cup', img: 'cup.png', radius: 56, weight: 22, shardsMin: 8, shardsMax: 11, density: 0.018, restitution: 0.18, friction: 0.3, shardColor: '#c5c5c5', strokeColor: '#adadad', points: 50, sound: { freqMin: 1500, freqMax: 2300, q: 0.8, duration: 0.2, decayPow: 2.2, glassTing: false } },
      { key: 'pot', name: 'Pot', img: 'pot.png', radius: 80, weight: 16, shardsMin: 11, shardsMax: 15, density: 0.028, restitution: 0.1, friction: 0.45, shardColor: '#b5a094', strokeColor: '#94806f', points: 90, sound: { freqMin: 450, freqMax: 750, q: 0.5, duration: 0.35, decayPow: 1.4, glassTing: false } },
      { key: 'vase', name: 'Vase', img: 'vase.png', radius: 88, weight: 12, shardsMin: 14, shardsMax: 19, density: 0.014, restitution: 0.28, friction: 0.2, shardColor: '#525f77', strokeColor: '#3b465c', points: 140, sound: { freqMin: 2600, freqMax: 3800, q: 1.2, duration: 0.3, decayPow: 1.15, glassTing: true } }
    ];
    const AGGREGATE_WEIGHT = CATALOG.reduce((sum, item) => sum + item.weight, 0);
    function getRandomEntity() {
      let roll = Math.random() * AGGREGATE_WEIGHT;
      for (const item of CATALOG) {
        if (roll < item.weight) return item;
        roll -= item.weight;
      }
      return CATALOG[0];
    }

    let score = 0, streak = 0, lastStrike = 0;
    const COMBO_LIMIT_MS = 2600;
    const scoreTextNode = document.getElementById('score-val');
    const comboNode = document.getElementById('combo-panel');
    const comboTextNode = document.getElementById('combo-val');
    const bannerTextNode = document.getElementById('banner-txt');
    const hintNode = document.getElementById('hint');
    let bannerTimer = null;

    function recordSmash(def, pt) {
      const cur = performance.now();
      streak = (cur - lastStrike < COMBO_LIMIT_MS) ? Math.min(streak + 1, 20) : 1;
      lastStrike = cur;

      const mult = Math.min(streak, 10);
      const earned = def.points * mult;
      score += earned;
      scoreTextNode.textContent = score.toLocaleString();

      if (streak > 1) {
        comboNode.className = 'hud-panel hud-right active';
        comboTextNode.textContent = 'x' + streak;
        comboNode.classList.remove('bump');
        void comboNode.offsetWidth;
        comboNode.classList.add('bump');
      } else {
        comboNode.className = 'hud-panel hud-right';
      }

      spawnPopup(earned, mult, pt);
      bannerTextNode.textContent = def.name + '!';
      bannerTextNode.className = 'active';
      clearTimeout(bannerTimer);
      bannerTimer = setTimeout(() => { bannerTextNode.className = ''; }, 700);

      if (hintNode.style.opacity !== '0') hintNode.style.opacity = '0';
    }

    function spawnPopup(pts, factor, origin) {
      const d = document.createElement('div');
      d.className = 'score-popup';
      d.style.left = origin.x + 'px';
      d.style.top = origin.y + 'px';
      d.style.fontSize = (factor > 1 ? 26 : 20) + 'px';
      d.textContent = '+' + pts + (factor > 1 ? '  x' + factor : '');
      document.body.appendChild(d);
      setTimeout(() => d.remove(), 900);
    }

    function emitDust(pt, hex, qty) {
      for (let i = 0; i < qty; i++) {
        const p = document.createElement('div');
        const diam = 18 + Math.random() * 26;
        p.className = 'dust-fx';
        p.style.width = diam + 'px';
        p.style.height = diam + 'px';
        p.style.left = (pt.x + (Math.random() - 0.5) * 70) + 'px';
        p.style.top = (pt.y + (Math.random() - 0.5) * 70) + 'px';
        p.style.background = `radial-gradient(circle, ${hex} 0%, transparent 70%)`;
        p.style.animationDelay = (Math.random() * 0.08) + 's';
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 750);
      }
    }

    const SHELVES = [
      { x: 19.85, yTop: 22.95, w: 35.9 },
      { x: 79.90, yTop: 22.95, w: 35.8 },
      { x: 19.85, yTop: 41.30, w: 35.9 },
      { x: 79.90, yTop: 41.30, w: 35.8 },
      { x: 19.85, yTop: 60.14, w: 35.9 },
      { x: 79.90, yTop: 60.14, w: 35.8 },
      { x: 49.90, yTop: 79.23, w: 36.4 }
    ];

    function projectCoords(px, py) {
      const ratio = Math.min(vw / 736, vh / 414);
      const dw = 736 * ratio, dh = 414 * ratio;
      return {
        x: (vw - dw) * 0.5 + (px / 100) * dw,
        y: (vh - dh) * 0.5 + (py / 100) * dh,
        scale: ratio
      };
    }

    function createTarget(shelf, preset) {
      const type = preset || getRandomEntity();
      const coords = projectCoords(shelf.x, shelf.yTop);
      const span = (shelf.w / 100) * 736 * coords.scale;
      const radius = Math.min(type.radius, Math.max(22, span * 0.30));
      const target = M.Bodies.circle(coords.x, coords.y - radius * 0.85, radius, { isStatic: true });
      
      const spriteScale = (radius * 2) / 420;
      target.render.sprite = { texture: type.img, xScale: spriteScale, yScale: spriteScale };
      target.isPlate = true;
      target.plateRadius = radius;
      target.objType = type;
      target.slotRef = shelf;

      M.World.add(eng.world, target);
      shelf.body = target;
    }

    function resetShelves() {
      SHELVES.forEach(s => {
        const prevType = s.body ? s.body.objType : null;
        if (s.body) {
          M.World.remove(eng.world, s.body);
          s.body = null;
        }
        createTarget(s, prevType);
      });
    }

    const fragments = [];
    M.Events.on(eng, 'afterUpdate', () => {
      const ts = performance.now();
      for (let i = fragments.length - 1; i >= 0; i--) {
        const item = fragments[i];
        const elapsed = ts - item.time;
        if (elapsed > 5200) {
          M.World.remove(eng.world, item.body);
          fragments.splice(i, 1);
        } else if (elapsed > 3800) {
          item.body.render.opacity = 1 - (elapsed - 3800) / 1400;
        }
      }
    });

    function breakBody(target, impactPos, impulse) {
      const def = target.objType;
      const { x: cx, y: cy } = target.position;
      const rad = target.plateRadius;
      const ref = target.slotRef;

      M.World.remove(eng.world, target);
      if (ref) {
        ref.body = null;
        setTimeout(() => createTarget(ref), 700 + Math.random() * 500);
      }

      const totalShards = def.shardsMin + Math.floor(Math.random() * (def.shardsMax - def.shardsMin + 1));
      const sliceAngles = Array.from({ length: totalShards }, (_, k) => 
        (k / totalShards) * Math.PI * 2 + (Math.random() - 0.5) * (Math.PI / totalShards) * 0.8
      );

      for (let idx = 0; idx < totalShards; idx++) {
        const aStart = sliceAngles[idx];
        const aEnd = sliceAngles[(idx + 1) % totalShards] + (idx === totalShards - 1 ? Math.PI * 2 : 0);
        const centerOffset = rad * 0.15 * Math.random();
        const randTheta = Math.random() * Math.PI * 2;
        
        const corePt = { x: cx + Math.cos(randTheta) * centerOffset, y: cy + Math.sin(randTheta) * centerOffset };
        const perimeter = [0, 0.5, 1].map(pct => {
          const theta = aStart + (aEnd - aStart) * pct;
          const dist = rad * (0.92 + Math.random() * 0.08);
          return { x: cx + Math.cos(theta) * dist, y: cy + Math.sin(theta) * dist };
        });

        const polygon = [corePt, ...perimeter];
        const centroid = polygon.reduce((acc, p) => ({ x: acc.x + p.x, y: acc.y + p.y }), { x: 0, y: 0 });
        centroid.x /= polygon.length;
        centroid.y /= polygon.length;

        const verts = polygon.map(p => ({ x: p.x - centroid.x, y: p.y - centroid.y }));
        const piece = M.Bodies.fromVertices(centroid.x, centroid.y, [verts], {
          render: { fillStyle: def.shardColor, strokeStyle: def.strokeColor, lineWidth: 1, opacity: 1 },
          friction: def.friction,
          restitution: def.restitution,
          density: def.density
        }, true);

        if (!piece) continue;
        M.World.add(eng.world, piece);
        fragments.push({ body: piece, time: performance.now() });

        const scatterDir = M.Vector.normalise(M.Vector.sub(piece.position, impactPos));
        const impactPower = 0.15 + Math.random() * 0.1 + Math.min(0.35, M.Vector.magnitude(impulse) * 0.01);
        M.Body.applyForce(piece, piece.position, M.Vector.mult(scatterDir, impactPower));
        M.Body.applyForce(piece, piece.position, { x: 0, y: -impactPower * 0.4 });
        M.Body.setAngularVelocity(piece, (Math.random() - 0.5) * 0.8);
      }

      const hitMagnitude = Math.min(1, M.Vector.magnitude(impulse) / 20);
      triggerAudio(def.sound, hitMagnitude);
      emitDust(impactPos, def.shardColor, 6 + Math.floor(hitMagnitude * 6));
      
      let shakes = 6 + Math.round(hitMagnitude * 8);
      const amp = 6 + hitMagnitude * 14;
      const initialStyle = rdr.canvas.style.transform;
      const shakeTimer = setInterval(() => {
        if (shakes-- <= 0) {
          rdr.canvas.style.transform = initialStyle;
          clearInterval(shakeTimer);
          return;
        }
        rdr.canvas.style.transform = `translate(${(Math.random() - 0.5) * amp}px, ${(Math.random() - 0.5) * amp}px)`;
      }, 16);

      recordSmash(def, impactPos);
    }

    let isInteracting = false;
    let dragOrigin = null;
    let path = [];

    function extractPointer(evt) {
      const src = evt.touches ? evt.touches[0] : evt;
      return { x: src.clientX, y: src.clientY };
    }

    function onStart(evt) {
      isInteracting = true;
      dragOrigin = extractPointer(evt);
      path = [{ ...dragOrigin, t: performance.now() }];
    }

    function onMove(evt) {
      if (!isInteracting) return;
      const curPos = extractPointer(evt);
      const now = performance.now();

      path.push({ ...curPos, t: now });
      while (path.length > 1 && now - path[0].t > 150) path.shift();

      const refPoint = path[0];
      const deltaT = now - refPoint.t;
      if (deltaT < 20) return;

      const swipeVel = { x: (curPos.x - refPoint.x) / deltaT * 16, y: (curPos.y - refPoint.y) / deltaT * 16 };
      if (M.Vector.magnitude(swipeVel) <= 2 || M.Vector.magnitude(M.Vector.sub(curPos, dragOrigin)) <= 15) return;

      for (const slot of SHELVES) {
        if (!slot.body) continue;
        if (M.Vector.magnitude(M.Vector.sub(curPos, slot.body.position)) < slot.body.plateRadius) {
          breakBody(slot.body, curPos, swipeVel);
        }
      }
    }

    function onEnd() {
      isInteracting = false;
      path = [];
    }

    window.addEventListener('pointerdown', onStart);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onEnd);
    window.addEventListener('pointerdown', () => { if (actx.state === 'suspended') actx.resume(); }, { once: true });

    SHELVES.forEach(shelf => createTarget(shelf));
  </script>
</body>
</html>
